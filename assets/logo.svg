<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Flood Monitor — water depth pipeline">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <!-- mark -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#f0f9ff"/>
  <g clip-path="url(#tile)">
    <g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" opacity="0.92">
      <path d="M8 50 Q32 16 56 50"/>
      <path d="M15 52 Q32 24 49 52"/>
      <path d="M22 54 Q32 33 42 54"/>
    </g>
    <path d="M4 43 C14 37 22 37 32 42 C42 47 50 47 60 41 L60 60 L4 60 Z" fill="url(#water)"/>
    <path d="M4 43 C14 37 22 37 32 42 C42 47 50 47 60 41" fill="none" stroke="#e0f2fe" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  </g>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="#0369a1" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="80" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="url(#wordmark)" letter-spacing="-0.4">Flood Monitor</text>
  <text x="81" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" letter-spacing="2.6">WATER DEPTH PIPELINE</text>
</svg>
